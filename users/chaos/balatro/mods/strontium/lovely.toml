target = "main.lua"
pattern = 'require "challenges"'
position = "after"
match_indent = false
payload = "init_strontium()"

# Draw debug overlay
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "G:draw()"
position = "after"
match_indent = true
payload = "draw_strontium_debug()"

# Handle input
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.keypressed(key)"
position = "after"
match_indent = true
payload = "if handle_strontium_input(key) then return end"

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.keypressed(key)"
position = "before"
match_indent = false
payload = """
function love.textinput(text)
    if handle_strontium_textinput then
        handle_strontium_textinput(text)
    end
end
"""

# Handle key release for Ctrl tracking
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.keyreleased(key)"
position = "after"
match_indent = true
payload = "if handle_strontium_keyreleased then handle_strontium_keyreleased(key) end"

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.update( dt )"
position = "after"
match_indent = true
payload = "update_strontium_debug(dt)"

# Add mouse wheel handler for inspector scrolling
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.keypressed(key)"
position = "before"
match_indent = false
payload = """
function love.wheelmoved(x, y)
    if handle_strontium_wheelmoved then
        handle_strontium_wheelmoved(x, y)
    end
end
"""

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.mousepressed(x, y, button, touch)"
position = "after"
match_indent = true
payload = "if handle_strontium_mousepressed and handle_strontium_mousepressed(x, y, button) then return end"

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.mousereleased(x, y, button)"
position = "after"
match_indent = true
payload = "if handle_strontium_mousereleased and handle_strontium_mousereleased(x, y, button) then return end"

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.mousemoved(x, y, dx, dy, istouch)"
position = "after"
match_indent = true
payload = "if handle_strontium_mousemoved then handle_strontium_mousemoved(x, y, dx, dy) end"


# Initialize shaders
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "boot_timer('shaders', 'controllers',0.7)"
position = "before"
match_indent = true
payload = "init_strontium_shaders()"

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "--Draw the shadow"
position = "before"
match_indent = true
payload = "local _perf_skip_shadow = G.PERF_MODE and G.I and G.I.CARD and #G.I.CARD >= (G.PERF_MODE_THRESHOLD or 200)"

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if not self.no_shadow and G.SETTINGS.GRAPHICS.shadows == 'On'"
position = "at"
match_indent = true
payload = "if not _perf_skip_shadow and not self.no_shadow and G.SETTINGS.GRAPHICS.shadows == 'On'"

# Batched/backing renderer skip logic
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "function Card:draw(layer)"
position = "after"
match_indent = true
payload = '''
if (G.USE_BATCHED_RENDERER or G.USE_STRONTIUM_RENDERER) and not self._batched_force_draw then
    local dominated_by_deck = self.area and self.area.config and self.area.config.type == 'deck'
    local is_dragged = G.CONTROLLER and G.CONTROLLER.dragging and G.CONTROLLER.dragging.target == self
    local is_focused = G.CONTROLLER and G.CONTROLLER.focused and G.CONTROLLER.focused.target == self
    -- Cards owned by UI (e.g. collection/menu previews) are not drawn by the main card loop;
    -- they must keep using vanilla draw when batching is enabled.
    local p = self.parent
    local mt = p and getmetatable(p) or nil
    local is_ui_parent =
        (p ~= nil) and (
            (rawget(_G, 'UIElement') and mt == UIElement) or
            (rawget(_G, 'UIBox') and mt == UIBox) or
            (p.UIT ~= nil) or
            (p.UIBox ~= nil)
        )

    if not is_ui_parent and not dominated_by_deck and not is_dragged and not is_focused then
        return
    end
end
'''

# Patch the SMODS version of Card:draw
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/card_draw.lua"]'
pattern = "function Card:draw(layer)"
position = "after"
match_indent = true
payload = '''
if (G.USE_BATCHED_RENDERER or G.USE_STRONTIUM_RENDERER) and not self._batched_force_draw then
    local dominated_by_deck = self.area and self.area.config and self.area.config.type == 'deck'
    local is_dragged = G.CONTROLLER and G.CONTROLLER.dragging and G.CONTROLLER.dragging.target == self
    local is_focused = G.CONTROLLER and G.CONTROLLER.focused and G.CONTROLLER.focused.target == self
    local p = self.parent
    local mt = p and getmetatable(p) or nil
    local is_ui_parent =
        (p ~= nil) and (
            (rawget(_G, 'UIElement') and mt == UIElement) or
            (rawget(_G, 'UIBox') and mt == UIBox) or
            (p.UIT ~= nil) or
            (p.UIBox ~= nil)
        )

    if not is_ui_parent and not dominated_by_deck and not is_dragged and not is_focused then
        return
    end
end
'''

# Call backing/batched renderer
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "for k, v in pairs(self.I.CARD) do"
position = "before"
match_indent = true
payload = '''
if G.USE_STRONTIUM_RENDERER and G.STRONTIUM_RENDERER then
    G.STRONTIUM_RENDERER:draw_all_cards(self.I.CARD)
elseif G.USE_BATCHED_RENDERER and G.BATCHED_RENDERER then
    G.BATCHED_RENDERER:reset_frame()
    G.BATCHED_RENDERER:draw_all_cards(self.I.CARD)
end
'''
