source = ~/nixos-cfg/config/hypr/themes/rose_pine_moon.conf

##########################
### GENERAL SETTINGS   ###
##########################
general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = false
    no_fade_in = false
}


##########################
### BACKGROUND IMAGE   ###
##########################
background {
    monitor =
    #path = screenshot                     # 'screenshot' = auto-capture screen and blur it
    path = ~/nixos-cfg/wallpapers/blockwavemoon.png
    blur_passes = 3
    blur_size = 4
    noise = 0.0
    contrast = 0.7
    brightness = 0.8172
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}


################################
### USER AVATAR IMAGE (ICON) ###
################################
image {
    monitor =
    path = ~/nixos-cfg/wallpapers/min-linux.jpg
    size = 130
    rounding = -1
    border_size = 0
    border_color = rgba(193, 180, 231, 0.1)  # $iris with alpha
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -50
    halign = center
    valign = center
}


##########################
### PASSWORD FIELD     ###
##########################
input-field {
    monitor =
    size = 300, 45
    outline_thickness = 1
    dots_size = 0.1
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(108, 112, 134, 0.4)    # $muted with alpha
    inner_color = rgba(42, 39, 63, 0.8)       # $surface with alpha
    font_color = rgba(224, 222, 244, 0.9)     # $text
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="##908caa80">Enter Password</span>  # $subtle with alpha
    hide_input = false
    rounding = 25
    check_color = rgba(62, 143, 176, 0)       # $pine with alpha
    fail_color = rgba(235, 111, 146, 0.3)     # $love with alpha
    fail_text = <span foreground="##eb6f92">Authentication Failed</span>  # $love
    fail_timeout = 2000
    fail_transitions = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -180
    halign = center
    valign = center
}

##########################################
### MUSIC PROGRESS BAR (Custom Script) ###
##########################################
label {
    monitor =
    text = cmd[update:1000] ~/nixos-cfg/scripts/music_progress
    font_size = 16
    font_family = Metropolis Medium, sans-serif
    color = rgba(255, 255, 255, 0.8)
    position = 0, -330
    halign = center
    valign = center
}

#################################################
### MUSIC ARTIST + TITLE (PLAYERCTL, BASH)    ###
#################################################
label {
    monitor =
    # Requires: playerctl, bash, sed
    # Displays currently playing music with artist and title, or "Nothing Playing" if no media is active

    text = cmd[update:2000] bash -c 'artist=$(playerctl metadata artist 2>/dev/null); title=$(playerctl metadata title 2>/dev/null); if [[ -n "$artist" && -n "$title" ]]; then artist_spaced=$(echo " $artist" | sed "s/./& /g"); title_spaced=$(echo "$title " | sed "s/./& /g"); echo "╔══════════════════╗ ║  ${artist_spaced}  -  ${title_spaced}  ║ ╚══════════════════╝"; else echo "Nothing Playing"; fi'
    font_size = 16
    font_family = SF Pro Display, sans-serif
    color = rgba(156, 207, 216, 0.8)  # $foam
    position = 0, -420
    halign = center
    valign = center
}


##########################
### DAY OF THE WEEK    ###
##########################
label {
    monitor =
    text = cmd[update:86400000] zsh -c 'date +"%A"'
    color = rgba(234, 154, 151, 0.8)  # $rose
    font_size = 84
    font_family = Stange, sans-serif
    position = 0, 270
    halign = center
    valign = center
}


#############################################
### DATE DISPLAY (e.g. 2  A u g u s t ...) ###
#############################################
label {
    monitor =
    text = cmd[update:60000] zsh -c 'date +"%-d %B, %Y" | sed "s/./& /g" | sed "s/ $//"'
    color = rgba(144, 140, 170, 0.9)  # $subtle
    font_size = 20
    font_family = SF Pro Display, sans-serif
    position = 0, 170
    halign = center
    valign = center
}


##########################
### TIME DISPLAY       ###
##########################
label {
    monitor =
    text = cmd[update:1000] zsh -c 'date +"- %-I:%M %p -" | sed "s/./& /g" | sed "s/ $//"'
    color = rgba(224, 222, 244, 0.9)  # $text
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = 0, 110
    halign = center
    valign = center
}

##########################
###   Temperature     ###
##########################
label {
    monitor =
    text = cmd[] zsh -c 'temp'
    color = rgba(144, 140, 170, 0.7)  # $subtle
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = 50, 130
    halign = left
    valign = bottom
}

##########################
### USERNAME (Linux)  ###
##########################
label {
    monitor =
    text = cmd[] zsh -c 'echo $USER'
    color = rgba(144, 140, 170, 0.7)  # $subtle
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = 50, 80
    halign = left
    valign = bottom
}


##########################
### HOSTNAME          ###
##########################
label {
    monitor =
    text = cmd[] zsh -c 'uname -n'
    color = rgba(110, 106, 134, 0.7)  # $muted
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = 50, 30
    halign = left
    valign = bottom
}


##########################
### SYSTEM UPTIME     ###
##########################
label {
    monitor =
    text = cmd[update:60000] zsh -c "uptime | cut -d ' ' -f2 | xargs echo \"Uptime:$2\""
    color = rgba(144, 140, 170, 0.7)  # $subtle
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = -50, 130
    halign = right
    valign = bottom
}


##########################
### BATTERY STATUS    ###
##########################
label {
    monitor =
    text = cmd[update:5000] zsh -c 'cat /sys/class/power_supply/macsmc-battery/capacity 2>/dev/null | head -1 | sed "s/$/%/" || echo ""'
    color = rgba(110, 106, 134, 0.7)  # $muted
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = -50, 100
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] zsh -c 'cat /sys/class/power_supply/macsmc-battery/status 2>/dev/null | head -1 || echo ""'
    color = rgba(110, 106, 134, 0.7)  # $muted
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = -50, 70
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] zsh -c "if [ $(btry | wc -l) -eq 3 ]; then btry | tail -1; fi"
    color = rgba(110, 106, 134, 0.7)  # $muted
    font_size = 16
    font_family = SF Pro Display, sans-serif
    position = -50, 40
    halign = right
    valign = bottom
}
